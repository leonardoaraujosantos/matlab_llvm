[project]
name = "matlab-llvm-backend"
version = "0.1.0"
description = "Remote backend for the matlab_llvm compiler: a FastAPI edge over the matlabc CLI (check / REPL / codegen / files)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "fastmcp>=3.3,<4",
    "httpx>=0.27",  # OpenAI proxy in /v1/chat; also used by TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# This is an application, not a distributable library: tell uv to manage a
# venv from the dependencies without trying to build/install the project.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "conftest.py", ".venv/*"]

[tool.coverage.report]
show_missing = true
