# Compose v2 (no top-level `version:` key). Coolify-ready.
# Single upstream port :8000 (REST now; MCP/SSE + DAP-over-WebSocket later).
services:
  backend-compiler:
    build:
      context: .
      dockerfile: Dockerfile
    image: matlab-llvm-backend:latest
    container_name: matlab_llvm_api
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Resource ceilings for the untrusted-code child processes.
      - MATLAB_BACKEND_CPU_SECONDS=10
      - MATLAB_BACKEND_WALL_TIMEOUT_S=15
      - MATLAB_BACKEND_MEMORY_MB=2048
      - MATLAB_BACKEND_WARM_POOL_SIZE=2
      # Tier-2 sandbox: bwrap is installed in the image. Needs user
      # namespaces — keep `none` unless the host/compose grants them.
      - MATLAB_BACKEND_SANDBOX_BACKEND=none
      # Auth: prefer CyberdyneAuth (validates bearer tokens against its
      # /api/v1/users/me). Falls back to a shared static token, then open.
      - CYBERDYNE_AUTH_URL=${CYBERDYNE_AUTH_URL:-}
      - MATLAB_BACKEND_API_TOKEN=${MATLAB_BACKEND_API_TOKEN:-}
      # MCP auth: require a minted token on /mcp (POST /v1/mcp/token).
      - MATLAB_BACKEND_MCP_REQUIRE_AUTH=${MATLAB_BACKEND_MCP_REQUIRE_AUTH:-}
      - MATLAB_BACKEND_MCP_TOKEN_SECRET=${MATLAB_BACKEND_MCP_TOKEN_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - workspace_data:/workspace
    restart: always
    # Defense-in-depth for arbitrary user code (plan §7 adds cap_drop,
    # read_only rootfs, pids_limit, nsjail/per-session containers).
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  workspace_data:
