name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:00 UTC daily — runs the strict + cocotb lanes that PR/push skip.
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab — useful for re-running a
    # nightly slice on demand without waiting for the cron.
    inputs:
      run-full:
        description: 'Also run the full (45-min) lane'
        type: boolean
        default: false
      run-nightly:
        description: 'Also run the nightly (cocotb + verilator) lane'
        type: boolean
        default: false

# Cancel in-flight CI when a newer commit lands on the same PR — keeps
# queue pressure low without losing coverage (latest commit always
# finishes).  But for pushes to main, do NOT cancel: the first run may
# be priming the LLVM 22 build cache (~40 min cold), and cancelling
# wastes the work and leaves the cache empty for the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # -------------------------------------------------------------------------
  # SMOKE — fast lanes that gate every PR (~5 min wall time after the
  # first LLVM build is cached).  First run: ~45 min for the one-time
  # LLVM 22 source build.  Subsequent runs: cache hit in ~10s, then ~5
  # min for the matlabc compile + smoke tests.
  #
  # Coverage: frontend-tests + runtime-tests + flowchart-emit-* + REPL.
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke (fast, every PR)
    runs-on: ubuntu-24.04
    # First run: ~40 min for the cold LLVM 22 source build + ~5 min
    # for the matlabc compile + smoke tests = ~50 min wall.
    # Subsequent runs hit the cached /opt/llvm and finish in ~5 min.
    # Keep enough headroom for the cold-cache case.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM 22 + build deps
        uses: ./.github/actions/setup-llvm

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-smoke-${{ github.sha }}
          restore-keys: |
            ccache-smoke-
            ccache-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMATLAB_LLVM_WITH_MLIR=ON \
            -DMATLAB_LLVM_WITH_PLOT=ON \
            -DLLVM_DIR="$LLVM_DIR" \
            -DMLIR_DIR="$MLIR_DIR"

      - name: Build matlabc
        run: cmake --build build --target matlabc -j

      - name: Build test binaries
        run: cmake --build build -j

      - name: Smoke tests — frontend + runtime + flowchart-emit + gpu-emit
        run: |
          ctest --test-dir build --output-on-failure -j $(nproc) \
            -R 'frontend-tests|^runtime-tests|^flowchart-emit|^gpu-emit'

      # GPU emission lane — verifies `matlabc -emit-{cuda,metal,opencl}`
      # produces structurally-complete bundles without needing GPU hardware.
      # GitHub Actions runners have no GPU, so the test exercises the EMIT
      # path only; real device validation (MTLLibrary JIT + MPS GEMM) runs
      # on a separate macOS runner via the gpu_metal_*_smoke.mm fixtures.

      - name: REPL regression suite
        run: bash test/Repl/run_tests.sh "$PWD/build/matlabc"

      - name: ccache stats
        if: always()
        run: ccache -s

  # -------------------------------------------------------------------------
  # FULL — heavy end-to-end lanes (~45 min wall time, plus the LLVM
  # build on first miss).  Runs on EVERY push (PR included) + schedule
  # + manual dispatch.  PRs get the same coverage as push-to-main so
  # regressions are caught before merge.  Concurrency cancellation
  # (top of file) discards superseded in-flight runs when a PR is
  # rebased / force-pushed, bounding minute spend.
  # -------------------------------------------------------------------------
  full:
    name: Full (complete ctest gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run-full == true)
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM 22 + build deps + verilator/cocotb
        uses: ./.github/actions/setup-llvm
        with:
          # libgmp-dev / libmpfr-dev are SymPP's transitive deps (needed both
          # to build SymPP and to link matlabc against libsympp).
          extra-apt-packages: verilator iverilog gtkwave python3-venv libgmp-dev libmpfr-dev

      - name: Install cocotb (Python)
        run: |
          python3 -m pip install --user --upgrade pip
          # numpy is imported by the emitted matlab_runtime.py (emit-python +
          # cocotb co-sim lanes); without it those lanes fail at import time.
          python3 -m pip install --user 'cocotb>=1.9,<2.0' cocotb-bus pytest numpy

      # Build the Symbolic Math Toolbox backend (SymPP) so the symbolic lanes
      # (run-tests-sym + sym_basic) actually run instead of skipping.  Cached
      # by SYMPP_REF — bump the key suffix to pull a newer SymPP.
      - name: Restore SymPP
        id: sympp-cache
        uses: actions/cache@v4
        with:
          path: /tmp/sympp_install
          key: sympp-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build SymPP (if not cached)
        if: steps.sympp-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leonardoaraujosantos/SymPP /tmp/SymPP
          # -DSYMPP_BUILD_TESTS=OFF skips the Catch2 FetchContent (a slow
          # network fetch we don't need — matlabc only links libsympp).
          cmake -S /tmp/SymPP -B /tmp/SymPP/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSYMPP_BUILD_TESTS=OFF
          cmake --build /tmp/SymPP/build -j"$(nproc)"
          cmake --install /tmp/SymPP/build --prefix /tmp/sympp_install
          test -f /tmp/sympp_install/lib/cmake/SymPP/SymPPConfig.cmake

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-full-${{ github.sha }}
          restore-keys: |
            ccache-full-
            ccache-smoke-
            ccache-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMATLAB_LLVM_WITH_MLIR=ON \
            -DMATLAB_LLVM_WITH_PLOT=ON \
            -DMATLAB_LLVM_WITH_SYM=ON \
            -DSymPP_DIR=/tmp/sympp_install/lib/cmake/SymPP \
            -DLLVM_DIR="$LLVM_DIR" \
            -DMLIR_DIR="$MLIR_DIR"

      - name: Build
        run: cmake --build build -j

      - name: Complete test gate (every ctest lane)
        # Runs ALL registered lanes — execute (run-tests) + every source
        # emitter (emit-c/cpp/python/typescript + strict) + the SystemVerilog
        # goldens + cocotb/Verilator co-sim + flowchart/DAP/REPL. The
        # CPU-bound lanes share a RESOURCE_LOCK so they serialize instead of
        # thrashing, and every lane has a fail-fast TIMEOUT (see CMakeLists.txt),
        # so running with -j and a hung external sim are both safe.
        run: ctest --test-dir build --output-on-failure -j $(nproc)

      # Examples sweep — compile/link/run every in-scope examples/**/*.m
      # through the AOT path and gate on regressions vs
      # test/Examples/known_failures.txt. Promoted from Nightly to per-PR
      # Full lane in #29 so baseline regressions surface immediately rather
      # than waiting for the nightly schedule. SymPP is built above and
      # WITH_SYM is on, so the symbolic examples link + run (not SKIPped).
      - name: Examples sweep (compile/run all examples)
        run: bash test/Examples/run_sweep.sh "$PWD/build/matlabc"

      # JIT/-dap parity gate — launch every in-scope example through
      # `matlabc -dap` and verify it reaches `terminated`, gating on
      # regressions vs test/Debug/jit_parity_known_issues.txt (issue #77).
      # Complements the AOT sweep above on the DAP-JIT axis. Deterministic
      # (serial, absolute paths); known flaky exec-time crashes are
      # allowlisted in the baseline and retried once.
      - name: JIT/-dap parity sweep (launch all examples)
        run: python3 test/Debug/jit_parity_sweep.py "$PWD/build/matlabc" --gate

      - name: ccache stats
        if: always()
        run: ccache -s

  # -------------------------------------------------------------------------
  # PERF-BENCH — Tier 7 of docs/acceleration_roadmap.md.  Builds matlabc
  # on the PR HEAD and on the merge-base with main, runs the LAPACK +
  # Mandelbrot bench harness on both, and fails the lane if any kernel
  # regressed by more than the threshold (default 30%, set wide because
  # shared-runner variance on GitHub Actions is ~10-15%).
  #
  # PR label `perf-allowed` downgrades the gate to informational — useful
  # when an intentional algorithmic change moves the numbers.  The full
  # comparison table lands on the workflow run's Summary tab regardless.
  # -------------------------------------------------------------------------
  perf-bench:
    name: Perf bench (regression gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # We need both PR HEAD and the merge-base, so fetch enough
          # history.  `fetch-depth: 0` is heavier than necessary but
          # GitHub Actions can't tell us the exact distance to main
          # ahead of time on PRs from forks.
          fetch-depth: 0

      - name: Set up LLVM 22 + build deps
        uses: ./.github/actions/setup-llvm
        with:
          # bench/lapack/driver.sh defaults WITH_BLAS=1, which makes the
          # runtime include <cblas.h> + <lapack.h> (provided by
          # libopenblas-dev) and link against -lblas -llapack (provided
          # by liblapack-dev's reference LAPACK; OpenBLAS's libopenblas
          # also satisfies the BLAS symbols via the -lblas alias on
          # Ubuntu).  Without these dev packages the perf-bench TU
          # fails to compile.
          extra-apt-packages: libopenblas-dev liblapack-dev

      - name: Install bench deps (numpy)
        run: python3 -m pip install --user numpy

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-perf-${{ github.sha }}
          restore-keys: |
            ccache-perf-
            ccache-smoke-
            ccache-

      # ---- HEAD side: bench the PR HEAD ----
      - name: Configure (HEAD)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMATLAB_LLVM_WITH_MLIR=ON \
            -DMATLAB_LLVM_WITH_PLOT=ON \
            -DLLVM_DIR="$LLVM_DIR" \
            -DMLIR_DIR="$MLIR_DIR"

      - name: Build matlabc (HEAD)
        run: cmake --build build --target matlabc -j

      - name: Bench HEAD
        run: bash scripts/run_perf_bench.sh head

      - name: Stash HEAD result
        run: cp bench/lapack/results/perf_head.json /tmp/perf_head.json

      # ---- BASE side: check out the merge-base and re-bench ----
      - name: Capture PR HEAD SHA + merge-base
        id: refs
        run: |
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "PR HEAD:     $head_sha"
          echo "Merge-base:  $base_sha"

      - name: Checkout merge-base (preserving bench harness from HEAD)
        run: |
          set -eux
          # Drop untracked build artifacts from the HEAD bench run so
          # the base checkout is clean.
          rm -rf bench/lapack/results
          git checkout ${{ steps.refs.outputs.base_sha }}
          # Restore the bench harness (scripts + bench/lapack) from the
          # PR HEAD on top of the base-runtime checkout, so a PR that
          # touches the harness itself still benches old runtime via
          # the new harness.  Directory pathspecs are evaluated by git
          # (not the shell) so they work even when the base lacks
          # files the HEAD added.
          git checkout ${{ steps.refs.outputs.head_sha }} -- \
            scripts/run_perf_bench.sh \
            bench/lapack/

      - name: Build matlabc (base)
        run: cmake --build build --target matlabc -j

      - name: Bench base
        run: bash scripts/run_perf_bench.sh base

      - name: Stash base result
        run: cp bench/lapack/results/perf_base.json /tmp/perf_base.json

      # ---- Compare ----
      - name: Check regression
        run: |
          ALLOW=""
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'perf-allowed') }}" == "true" ]]; then
            ALLOW="--allow-regression"
            echo "PR label 'perf-allowed' present — gate is informational only." >&2
          fi
          python3 bench/lapack/check_regression.py \
            --base /tmp/perf_base.json \
            --head /tmp/perf_head.json \
            --threshold 0.30 \
            $ALLOW

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bench-results
          path: |
            /tmp/perf_head.json
            /tmp/perf_base.json
          if-no-files-found: warn

      - name: ccache stats
        if: always()
        run: ccache -s

  # -------------------------------------------------------------------------
  # NIGHTLY — strict-emit lanes + cocotb / verilator hardware co-simulation
  # (~60 min wall time).  Scheduled at 04:00 UTC.  Runnable on demand via
  # workflow_dispatch and on PRs labelled `nightly-ci`.
  # -------------------------------------------------------------------------
  nightly:
    name: Nightly (strict + cocotb + verilator)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'nightly-ci')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run-nightly == true)
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM 22 + build deps + verilator + cocotb deps
        uses: ./.github/actions/setup-llvm
        with:
          # libgmp-dev / libmpfr-dev are SymPP's transitive deps (needed both
          # to build SymPP and to link the symbolic examples in the sweep).
          extra-apt-packages: verilator iverilog gtkwave python3-venv libgmp-dev libmpfr-dev

      - name: Install cocotb (Python)
        run: |
          python3 -m pip install --user --upgrade pip
          # cocotb pin avoids drift if upstream lands a breaking release.
          # numpy is imported by the emitted matlab_runtime.py (cocotb + emit-python).
          python3 -m pip install --user 'cocotb>=1.9,<2.0' cocotb-bus pytest numpy

      - name: Tool versions (sanity)
        run: |
          clang --version
          mlir-opt --version || true
          verilator --version
          python3 -c 'import cocotb; print("cocotb", cocotb.__version__)'

      # Build the Symbolic Math Toolbox backend (SymPP) so the examples sweep can
      # link + run the symbolic examples instead of SKIPping them.  Shares the
      # SYMPP_REF cache with the full job; bump the key suffix to pull a newer SymPP.
      - name: Restore SymPP
        id: sympp-cache
        uses: actions/cache@v4
        with:
          path: /tmp/sympp_install
          key: sympp-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build SymPP (if not cached)
        if: steps.sympp-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/leonardoaraujosantos/SymPP /tmp/SymPP
          # -DSYMPP_BUILD_TESTS=OFF skips the Catch2 FetchContent (a slow
          # network fetch we don't need — matlabc only links libsympp).
          cmake -S /tmp/SymPP -B /tmp/SymPP/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSYMPP_BUILD_TESTS=OFF
          cmake --build /tmp/SymPP/build -j"$(nproc)"
          cmake --install /tmp/SymPP/build --prefix /tmp/sympp_install
          test -f /tmp/sympp_install/lib/cmake/SymPP/SymPPConfig.cmake

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-nightly-${{ github.sha }}
          restore-keys: |
            ccache-nightly-
            ccache-full-
            ccache-smoke-
            ccache-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMATLAB_LLVM_WITH_MLIR=ON \
            -DMATLAB_LLVM_WITH_PLOT=ON \
            -DMATLAB_LLVM_WITH_SYM=ON \
            -DSymPP_DIR=/tmp/sympp_install/lib/cmake/SymPP \
            -DLLVM_DIR="$LLVM_DIR" \
            -DMLIR_DIR="$MLIR_DIR"

      - name: Build
        run: cmake --build build -j

      - name: Smoke lanes
        run: |
          ctest --test-dir build --output-on-failure -j $(nproc) \
            -R 'frontend-tests|^runtime-tests|^flowchart-emit'
          bash test/Repl/run_tests.sh "$PWD/build/matlabc"

      - name: Run-tests (full)
        run: ctest --test-dir build --output-on-failure -R '^run-tests$'

      - name: Strict emit lanes (emit-c / emit-cpp / emit-c-strict)
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^run-tests-emit-(c|cpp|c-strict)$'

      - name: SystemVerilog goldens
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^emit-sv-(tests|fail-tests|ports-tests)$'

      - name: Cocotb + verilator co-sim lanes
        run: |
          ctest --test-dir build --output-on-failure \
            -R '^(cocotb-tests|flowchart-emit-(chart|diagram)-cocotb|flowchart-emit-subsystem-sv-(verilator|cosim))$'

      # Examples sweep was moved to the Full lane in #29 — it now runs on
      # every PR so baseline regressions surface immediately. Nightly still
      # exercises the strict / cocotb / verilator lanes above.

      - name: ccache stats
        if: always()
        run: ccache -s
