name: 'Set up LLVM 22 + matlabc build deps'
description: |
  Installs the build deps (cmake, ninja, ccache, cairo, ...) and provides
  LLVM 22.1.3 + MLIR at /opt/llvm.

  Resolution order for /opt/llvm (first hit wins):
    1. Prebuilt tarball published as a GitHub Release asset by
       .github/workflows/build-llvm-toolchain.yml
       (toolchain-<tag>/llvm-<tag>-linux-x64.tar.zst) — ~30s download.
       Immune to Actions-cache eviction, the 7-day expiry, the 10 GB
       limit, and per-branch cache scoping.
    2. actions/cache (per-branch / main scoped) — fast when warm, a
       resilience fallback if the asset isn't published yet.
    3. Source build from llvm-project at <tag> — the ~2h cold path, only
       hit on a brand-new version before its tarball has been published.

  Sets the following environment variables for downstream steps:
    LLVM_DIR  = /opt/llvm/lib/cmake/llvm
    MLIR_DIR  = /opt/llvm/lib/cmake/mlir
    CC        = clang
    CXX       = clang++

inputs:
  llvm-tag:
    description: 'LLVM source git tag (e.g. llvmorg-22.1.3).'
    required: false
    default: 'llvmorg-22.1.3'
  extra-apt-packages:
    description: 'Space-separated apt packages to install in addition to the defaults.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        set -euxo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build ccache pkg-config zstd \
          gcc g++ \
          libcairo2-dev \
          libzstd-dev libcurl4-openssl-dev libedit-dev \
          libxml2-dev zlib1g-dev libtinfo-dev \
          python3 python3-pip \
          ${{ inputs.extra-apt-packages }}

    # ----- 1) Prebuilt tarball (primary, ~30s) ---------------------------
    - name: Download prebuilt LLVM tarball (if published)
      id: llvm-prebuilt
      shell: bash
      env:
        TAG: ${{ inputs.llvm-tag }}
        REPO: ${{ github.repository }}
      run: |
        set -uxo pipefail   # NB: no -e — a 404 must not abort the job.
        url="https://github.com/${REPO}/releases/download/toolchain-${TAG}/llvm-${TAG}-linux-x64.tar.zst"
        if curl -fSL --retry 3 --retry-delay 5 -o /tmp/llvm.tar.zst "$url"; then
          sudo mkdir -p /opt/llvm
          sudo chown "$(id -u):$(id -g)" /opt/llvm
          tar -C /opt/llvm --zstd -xf /tmp/llvm.tar.zst
          rm -f /tmp/llvm.tar.zst
          if [[ -f /opt/llvm/lib/cmake/mlir/MLIRConfig.cmake ]]; then
            echo "have-llvm=true" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt tarball extracted but MLIRConfig.cmake missing — ignoring."
            sudo rm -rf /opt/llvm
            echo "have-llvm=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "No prebuilt tarball at $url — falling back to cache/source build."
          echo "have-llvm=false" >> "$GITHUB_OUTPUT"
        fi

    # ----- 2) actions/cache (fallback) -----------------------------------
    # Key salt v3: v2 was permanently poisoned by 206-byte empty caches
    # that an earlier `if: always()` save step seeded from cancelled cold
    # builds (cache keys are immutable, so the empty entry could never be
    # overwritten).  v3 starts clean and the save step below only ever
    # runs after a *successful* source build, so it cannot re-poison.
    - name: Restore /opt/llvm cache
      id: llvm-cache
      if: steps.llvm-prebuilt.outputs.have-llvm != 'true'
      uses: actions/cache/restore@v4
      with:
        path: /opt/llvm
        key: llvm-${{ inputs.llvm-tag }}-v3-${{ runner.os }}-${{ runner.arch }}

    # A restored (or prebuilt) /opt/llvm is only useful if cmake can find
    # MLIR in it.  If not, wipe it so the source build re-primes cleanly.
    - name: Validate /opt/llvm
      id: llvm-validate
      shell: bash
      run: |
        if [[ -f /opt/llvm/lib/cmake/mlir/MLIRConfig.cmake ]]; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
          sudo rm -rf /opt/llvm
        fi

    # ----- 3) Source build (~2h cold path, last resort) ------------------
    - name: Build LLVM ${{ inputs.llvm-tag }} (source fallback)
      id: llvm-build
      if: steps.llvm-validate.outputs.valid != 'true'
      shell: bash
      run: |
        set -euxo pipefail
        sudo mkdir -p /opt/llvm
        sudo chown "$(id -u):$(id -g)" /opt/llvm
        git clone --depth 1 -b "${{ inputs.llvm-tag }}" \
          https://github.com/llvm/llvm-project /tmp/llvm-project
        cmake -S /tmp/llvm-project/llvm -B /tmp/llvm-build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/opt/llvm \
          -DLLVM_ENABLE_PROJECTS="mlir" \
          -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
          -DLLVM_INSTALL_UTILS=ON \
          -DLLVM_BUILD_LLVM_DYLIB=ON \
          -DLLVM_LINK_LLVM_DYLIB=ON \
          -DLLVM_ENABLE_RTTI=ON \
          -DLLVM_ENABLE_ASSERTIONS=OFF
        cmake --build /tmp/llvm-build --target install -j"$(nproc)"
        # Slim the install — strip docs and man pages we don't use.
        rm -rf /opt/llvm/share/man /opt/llvm/share/doc
        rm -rf /tmp/llvm-project /tmp/llvm-build
        test -f /opt/llvm/lib/cmake/mlir/MLIRConfig.cmake

    # Save ONLY after a source build that actually succeeded.  Gated on
    # success() AND the build step's own success outcome, so a cancelled
    # or failed build can never seed (and, via key immutability, lock) an
    # empty /opt/llvm under this key.  A prebuilt-tarball or cache hit
    # leaves llvm-build skipped, so this no-ops there too.
    - name: Save /opt/llvm cache
      if: success() && steps.llvm-build.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: /opt/llvm
        key: llvm-${{ inputs.llvm-tag }}-v3-${{ runner.os }}-${{ runner.arch }}

    - name: Export LLVM env vars
      shell: bash
      run: |
        echo "LLVM_DIR=/opt/llvm/lib/cmake/llvm" >> "$GITHUB_ENV"
        echo "MLIR_DIR=/opt/llvm/lib/cmake/mlir" >> "$GITHUB_ENV"
        echo "PATH=/opt/llvm/bin:$PATH" >> "$GITHUB_ENV"
        echo "CC=clang" >> "$GITHUB_ENV"
        echo "CXX=clang++" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/opt/llvm/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
